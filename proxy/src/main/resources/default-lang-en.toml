# PINGWIN-VELOCITY - słownik angielski (pingwin-lang/en.toml).
#
# Proxy podmienia frazy "from" na "to" we wszystkich wiadomościach do graczy z językiem angielskim:
# czat, actionbar, title, bossbar, tablista i komunikaty przy wyrzuceniu - z proxy i ze wszystkich serwerów.
#
# Fraza musi być dokładnie fragmentem tekstu między zmianami koloru. Przykład:
#   <#C10017>✘ <dark_gray>⏸ <white>Nieprawidłowe hasło!   ->   from = "Nieprawidłowe hasło!"
# Dłuższe frazy mają pierwszeństwo. Po zmianach: /velocity reload albo restart proxy.
# Nowy język = nowy plik, np. pingwin-lang/de.toml (kod pliku = kod w /jezyk).

# ---------------- /jezyk ----------------
[[phrase]]
from = "Twój język: "
to = "Your language: "
[[phrase]]
from = ". Wybierz:"
to = ". Choose:"
[[phrase]]
from = "Ustawiono język: "
to = "Language set: "
[[phrase]]
from = "Nie ma takiego języka. Dostępne: "
to = "No such language. Available: "

