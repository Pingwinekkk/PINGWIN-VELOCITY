# This workflow will build a Java project with Gradle
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle
on:
  push:
    branches:
      - dev/4.0.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_BRANCH: refs/heads/dev/4.0.0

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: 'zulu'

    - name: Generate Release Tag
      if: github.ref == env.RELEASE_BRANCH
      id: release_tag
      run: |
        # Fetch all tags from remote
        git fetch --tags

        # Get the latest build number from existing releases
        LATEST_BUILD=0

        # Check if there are existing build tags and find the highest number
        if git tag | grep -E "^build-[0-9]+$" > /dev/null; then
          LATEST_BUILD=$(git tag | grep -E "^build-[0-9]+$" | sed 's/build-//' | sort -n | tail -1)
        fi

        # Debug output
        echo "All tags:"
        git tag
        echo "Build tags found:"
        git tag | grep -E "^build-[0-9]+$" || echo "No build tags found"
        echo "Latest build number found: $LATEST_BUILD"

        # Increment the build number
        NEW_BUILD=$((LATEST_BUILD + 1))

        echo "tag=build-$NEW_BUILD" >> $GITHUB_OUTPUT
        echo "build_nr=$NEW_BUILD" >> $GITHUB_OUTPUT
        echo "Generated tag: build-$NEW_BUILD"
        echo "Previous highest build: $LATEST_BUILD"
        echo "New build number: $NEW_BUILD"

    - name: Build with Gradle
      env:
        BUILD_NUMBER: ${{ steps.release_tag.outputs.build_nr }}
      run: ./gradlew build

    - name: Rename PINGWIN-VELOCITY Fat Jar
      if: github.ref == env.RELEASE_BRANCH
      run: |
        JAR=$(ls proxy/build/libs/velocity-proxy-*-all.jar)
        VERSION=$(echo "$JAR" | sed 's|proxy/build/libs/velocity-proxy-||' | sed 's|-all\.jar||')
        cp "$JAR" "proxy/build/libs/pingwin-velocity-fatjar-$VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

    - name: Rename PINGWIN-VELOCITY Bootstrap Jar
      if: github.ref == env.RELEASE_BRANCH
      run: |
        JAR=$(ls bootstrap/build/libs/velocity-bootstrap-*.jar | grep -v -- '-sources\.jar')
        VERSION=$(echo "$JAR" | sed 's|bootstrap/build/libs/velocity-bootstrap-||' | sed 's|\.jar||')
        cp "$JAR" "bootstrap/build/libs/pingwin-velocity-$VERSION-${{ steps.release_tag.outputs.build_nr }}.jar"

    - name: Upload as GitHub Release
      if: github.ref == env.RELEASE_BRANCH
      continue-on-error: true
      uses: softprops/action-gh-release@v3
      with:
        name: "PINGWIN-VELOCITY build-${{ steps.release_tag.outputs.build_nr }}"
        tag_name: "${{ steps.release_tag.outputs.tag }}"
        token: "${{ secrets.GITHUB_TOKEN }}"
        prerelease: false
        generate_release_notes: true
        body: |
          ## PINGWIN-VELOCITY
          Fork [Velocity-CTD](https://github.com/GemstoneGG/Velocity-CTD) (GPL-3.0).

          **Do serwera pobierz `pingwin-velocity-fatjar-<wersja>-<build>.jar`** - zawiera wszystko i nie pobiera nic przy starcie.
          `pingwin-velocity-<wersja>-<build>.jar` (bootstrap) przy pierwszym starcie dociąga biblioteki.

          ---
        files: |
          proxy/build/libs/pingwin-velocity-fatjar-*-${{ steps.release_tag.outputs.build_nr }}.jar
          bootstrap/build/libs/pingwin-velocity-*-${{ steps.release_tag.outputs.build_nr }}.jar
